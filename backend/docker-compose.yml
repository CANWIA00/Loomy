services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: management_dashboard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16-alpine
    container_name: dashboard-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: management_dashboard
    volumes:
      - pgbackups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: /bin/sh
    command: >
      -c "
      apk add --no-cache bash > /dev/null 2>&1;
      chmod +x /usr/local/bin/backup.sh;
      echo '⏳ Ilk backup 6 saat icinde calisacak...';
      while true; do
        /usr/local/bin/backup.sh;
        sleep 21600;
      done
      "
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: .
    container_name: dashboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/management_dashboard?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-2024"
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgbackups:
