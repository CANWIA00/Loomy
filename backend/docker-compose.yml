version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dashboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: management_dashboard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: dashboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:5432/management_dashboard?schema=public"
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production-2024"
      PORT: 8080
    depends_on:
      - postgres

volumes:
  pgdata:
