services:
  postgres:
    image: postgres:16-alpine
    container_name: loomy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: management_dashboard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loomy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/management_dashboard?schema=public"
      JWT_SECRET: "loomy-super-secret-jwt-key-2024"
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: